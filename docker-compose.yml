name: blog-me

services:
  # TLS-terminating reverse proxy. Serves https://blog.me (+ subdomains) using
  # certificates minted by mkcert on the host (see bin/setup-certs.sh).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
      - mailpit
      - minio

  # Serves the app: static files from public/, everything else to php-fpm.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # PHP-FPM 8.5 with the project bind-mounted at /var/www/html.
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      DATABASE_URL: "${DATABASE_URL:-mysql://blog:blog@mariadb:3306/blog}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://minio:9000}"
      S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT:-https://s3.blog.me}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-uploads}"
      S3_KEY: "${S3_KEY:-minio}"
      S3_SECRET: "${S3_SECRET:-minio12345}"
      S3_USE_PATH_STYLE: "${S3_USE_PATH_STYLE:-true}"
      MAILER_DSN: "${MAILER_DSN:-smtp://mailpit:1025}"
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug.ini:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${MARIADB_DATABASE:-blog}"
      MARIADB_USER: "${MARIADB_USER:-blog}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:-blog}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-root}"
    ports:
      - "127.0.0.1:${MARIADB_PORT:-13306}:3306"
    volumes:
      - ${MARIADB_DATA_PATH:-./data/mariadb}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-13379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for uploads.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio12345}"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - ${MINIO_DATA_PATH:-./data/minio}:/data

  # One-shot: waits for MinIO, then creates the uploads bucket with public reads.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio12345}"
      S3_BUCKET: "${S3_BUCKET:-uploads}"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1; do
        echo 'waiting for minio...'; sleep 1;
      done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      mc anonymous set download local/$$S3_BUCKET;
      echo 'minio bucket ready: '$$S3_BUCKET;
      "
    restart: "no"

  # Catch-all SMTP server + web UI for outgoing mail.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025"

# mariadb + minio persist to ./data/ on the host (see MARIADB_DATA_PATH /
# MINIO_DATA_PATH). The rest stay as Docker-managed named volumes.
volumes:
  redis_data:
  caddy_data:
  caddy_config:
