[PHP]
memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 51M
max_execution_time = 60
date.timezone = UTC
expose_php = Off

; Dev: surface everything.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
; Pick up source changes on every request (dev only).
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
